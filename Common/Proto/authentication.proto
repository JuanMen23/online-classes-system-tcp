syntax = "proto3";

option csharp_namespace = "Common.Proto";

package common.proto;

service AuthenticationService {
  rpc ValidateCredentials(ValidateRequest) returns (ValidateResponse);
}

message ValidateRequest {
  string username = 1;
  string password = 2;
}

message ValidateResponse {
  bool valid = 1;
  string message = 2;
}

